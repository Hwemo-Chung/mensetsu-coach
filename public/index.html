<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面接コーチ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <span class="brand">面接コーチ <span class="sub" data-i18n="title"></span></span>
      <div class="controls">
      <select id="dest" class="lang" data-i18n-label-dest="label"></select>
      <select id="lang" class="lang" data-i18n-label="language"></select>
      <button type="button" id="end" class="end" data-i18n="end"></button>
      </div>
    </header>
    <main id="log" class="log" aria-live="polite"></main>
    <form id="composer" class="composer">
      <div id="chip" class="chip" hidden><span id="chipName"></span><button type="button" id="chipX" data-i18n-label="removeFile">×</button></div>
      <div class="row">
        <label class="attach" data-i18n-label="attach">📎<input id="file" type="file" accept=".pdf,.docx,.txt,.md,image/png,image/jpeg,image/webp,image/gif" hidden></label>
        <textarea id="input" rows="2" required></textarea>
        <button id="send" type="submit" data-i18n="send"></button>
      </div>
      <p class="note" data-i18n="note"></p>
    </form>
  </div>
  <dialog id="mail" class="mail">
    <form id="mailForm" method="dialog">
      <h2 data-i18n-mail="title"></h2>
      <p class="mail-body" data-i18n-mail="body"></p>
      <input id="mailEmail" type="email" autocomplete="email" required>
      <label class="consent"><input id="mailConsent" type="checkbox"> <span data-i18n-mail="consent"></span></label>
      <p id="mailMsg" class="mail-msg" role="status"></p>
      <div class="mail-actions">
        <button type="button" id="mailLater" data-i18n-mail="later"></button>
        <button type="submit" id="mailSubmit" data-i18n-mail="submit"></button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
