<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面接コーチ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <span class="brand">面接コーチ <span class="sub" data-i18n="title"></span></span>
      <div class="controls">
        <span class="picker"><svg class="icon" aria-hidden="true"><use href="/icons.svg#flag"></use></svg><select id="dest" class="lang"></select></span>
        <span class="picker"><svg class="icon" aria-hidden="true"><use href="/icons.svg#globe"></use></svg><select id="lang" class="lang" data-i18n-label="language"></select></span>
        <button type="button" id="panelToggle" class="end" aria-controls="panel" aria-expanded="false" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#panel"></use></svg><span class="lbl" data-i18n="panel"></span></button>
        <button type="button" id="opts" class="end ib" aria-haspopup="dialog" aria-controls="options" data-i18n-label="opts.button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg></button>
        <button type="button" id="end" class="end"><svg class="icon" aria-hidden="true"><use href="/icons.svg#download"></use></svg><span class="lbl" data-i18n="end"></span></button>
      </div>
    </header>
    <nav id="rail" class="rail" aria-labelledby="railTitle">
      <div id="railGuide">
        <h2 class="rail-title" data-i18n="rail.guideTitle"></h2>
        <ol class="rail-steps"><li data-i18n="rail.step1"></li><li data-i18n="rail.step2"></li><li data-i18n="rail.step3"></li></ol>
      </div>
      <div id="railList" hidden>
        <h2 id="railTitle" class="rail-title" data-i18n="rail.title"></h2>
        <p id="railProgress" class="rail-progress"></p>
        <progress id="railBar" max="10" value="0" aria-hidden="true"></progress>
        <ol id="railItems" class="rail-items"></ol>
      </div>
    </nav>
    <main id="log" class="log" aria-live="polite"></main>
    <form id="composer" class="composer">
      <div id="tour" class="tour" role="dialog" aria-labelledby="tourTitle" aria-describedby="tourBody" tabindex="-1" hidden>
        <p class="tour-head"><span id="tourStep"></span><strong id="tourTitle"></strong></p>
        <p id="tourBody"></p>
        <div class="tour-actions">
          <button type="button" id="tourSkip" class="inline-btn"></button>
          <button type="button" id="tourPrev" class="inline-btn"></button>
          <button type="button" id="tourNext" class="inline-btn"></button>
        </div>
      </div>
      <div id="chip" class="chip" hidden><span id="chipName"></span><button type="button" id="chipX" data-i18n-label="removeFile"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"></use></svg></button></div>
      <div class="notices"><p id="micStatus" class="mic-status" aria-live="polite" hidden></p><p id="micNote" class="mic-status" hidden></p></div>
      <div class="row">
        <label class="attach" tabindex="0" role="button" data-i18n-label="attach"><svg class="icon" aria-hidden="true"><use href="/icons.svg#attach"></use></svg><input id="file" type="file" accept=".pdf,.docx,.txt,.md,image/png,image/jpeg,image/webp,image/gif" hidden></label>
        <textarea id="input" rows="1" required></textarea>
        <button type="button" id="mic" class="mic" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#mic"></use></svg></button>
        <button id="send" type="submit"><svg class="icon" aria-hidden="true"><use href="/icons.svg#send"></use></svg><span class="lbl" data-i18n="send"></span></button>
      </div>
      <p class="note"><span data-i18n="note"></span> <a href="/privacy.html" data-i18n="privacy"></a></p>
    </form>
    <aside id="panel" class="panel" aria-labelledby="panelToggle" hidden>
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button type="button" id="tabReview" class="tab" role="tab" aria-selected="true" aria-controls="paneReview" data-i18n="panel.review"></button>
          <button type="button" id="tabNotes" class="tab" role="tab" aria-selected="false" aria-controls="paneNotes" tabindex="-1" data-i18n="panel.notes"></button>
        </div>
        <button type="button" id="panelClose" class="tab panel-close" data-i18n="panelClose"></button>
      </div>
      <div id="paneReview" class="pane" role="tabpanel" aria-labelledby="tabReview"><p id="reviewEmpty" class="legend" data-i18n="panel.empty"></p><div id="reviewGuide" class="guide"></div><div id="reviewBox"></div></div>
      <div id="paneNotes" class="pane" role="tabpanel" aria-labelledby="tabNotes" hidden>
        <p id="notesEmpty" class="legend" data-i18n="notes.empty"></p>
        <div id="noteBox" class="note-box" hidden>
          <label id="noteLabel" for="note"></label>
          <textarea id="note" rows="8"></textarea>
          <p id="noteStatus" class="legend" role="status"></p>
        </div>
      </div>
    </aside>
    <aside id="start" class="start" aria-labelledby="startTitle" hidden>
      <h2 id="startTitle" data-i18n="start.title"></h2>
      <p class="start-lead" data-i18n="start.lead"></p>
      <p class="start-gets" data-i18n="start.gets"></p>
      <ul class="start-list">
        <li><svg class="icon" aria-hidden="true"><use href="/icons.svg#question"></use></svg><span data-i18n="start.get1"></span></li>
        <li><svg class="icon" aria-hidden="true"><use href="/icons.svg#check"></use></svg><span data-i18n="start.get2"></span></li>
        <li><svg class="icon" aria-hidden="true"><use href="/icons.svg#speaker"></use></svg><span data-i18n="start.get3"></span></li>
      </ul>
      <button type="button" id="startCta" class="start-cta" data-i18n="start.cta"></button>
    </aside>
  </div>
  <dialog id="confirm" class="mail" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmBody" class="mail-body"></p>
      <div class="mail-actions">
        <button id="confirmNo" value="no"></button>
        <button id="confirmYes" class="primary" value="yes"></button>
      </div>
    </form>
  </dialog>
  <dialog id="options" class="mail" aria-labelledby="optionsTitle">
    <form method="dialog">
      <h2 id="optionsTitle" data-i18n="opts.button"></h2>
      <label class="consent switch"><input id="tourTips" type="checkbox" role="switch" aria-describedby="tourTipsHint" checked> <span data-i18n="opts.tourTips"></span></label>
      <p id="tourTipsHint" class="legend" data-i18n="opts.tourTipsHint"></p>
      <fieldset class="opt-group" aria-describedby="tourEndHint">
        <legend data-i18n="opts.tourEnd"></legend>
        <label class="consent switch"><input type="radio" name="tourEnd" value="a"> <span data-i18n="opts.tourEndA"></span></label>
        <label class="consent switch"><input type="radio" name="tourEnd" value="b"> <span data-i18n="opts.tourEndB"></span></label>
      </fieldset>
      <p id="tourEndHint" class="legend" data-i18n="opts.tourEndHint"></p>
      <fieldset class="opt-group">
        <legend data-i18n="opts.voice"></legend>
        <label class="consent switch"><input type="radio" name="ttsVoice" value="Kore"> <span data-i18n="opts.voiceKore"></span></label>
        <label class="consent switch"><input type="radio" name="ttsVoice" value="Charon"> <span data-i18n="opts.voiceCharon"></span></label>
      </fieldset>
      <div class="consent switch"><label for="ttsSpeed" data-i18n="opts.speed"></label>
        <select id="ttsSpeed" class="speed" aria-describedby="ttsSpeedHint"><option value="0.8">0.8×</option><option value="1">1.0×</option><option value="1.2">1.2×</option></select>
      </div>
      <p id="ttsSpeedHint" class="legend" data-i18n="opts.speedHint"></p>
      <fieldset id="desired" class="opt-group desired" aria-describedby="desiredHint" hidden>
        <legend data-i18n="opts.desired"></legend>
        <p id="desiredHint" class="legend" data-i18n="opts.desiredHint"></p>
        <label><span data-i18n="opts.desiredRole"></span><textarea data-desired="role_content" rows="2" maxlength="500"></textarea></label>
        <label><span data-i18n="opts.desiredExcluded"></span><textarea data-desired="excluded_roles" rows="2" maxlength="500"></textarea></label>
        <label><span data-i18n="opts.desiredHard"></span><textarea data-desired="hard_conditions" rows="2" maxlength="500"></textarea></label>
        <label><span data-i18n="opts.desiredSalary"></span><input data-desired="min_salary_man" type="number" min="0" max="99999" step="1" inputmode="numeric"></label>
        <label><span data-i18n="opts.desiredTarget"></span><input data-desired="salary_target_man" type="number" min="0" max="99999" step="1" inputmode="numeric"></label>
        <label><span data-i18n="opts.desiredOvertime"></span><input data-desired="max_overtime_hours" type="number" min="0" max="999" step="1" inputmode="numeric"></label>
        <label><span data-i18n="opts.desiredEmployment"></span><select data-desired="employment_required"><option value="" data-i18n="opts.desiredAny"></option><option value="seishain" data-i18n="opts.employment.seishain"></option><option value="contract" data-i18n="opts.employment.contract"></option><option value="dispatch" data-i18n="opts.employment.dispatch"></option><option value="outsourced" data-i18n="opts.employment.outsourced"></option></select></label>
        <label><span data-i18n="opts.desiredLocations"></span><input data-desired="locations" type="text" maxlength="200" autocomplete="off"></label>
        <label><span data-i18n="opts.desiredRemote"></span><input data-desired="remote_min_days" type="number" min="0" max="7" step="1" inputmode="numeric"></label>
        <label><span data-i18n="opts.desiredClientSite"></span><select data-desired="exclude_client_site"><option value="" data-i18n="opts.desiredAny"></option><option value="1" data-i18n="opts.desiredClientSiteNo"></option></select></label>
        <label><span data-i18n="opts.desiredJob"></span><select data-desired="job_tag"><option value="" data-i18n="opts.desiredAny"></option><option value="manager" data-i18n="opts.jobTag.manager"></option><option value="pm" data-i18n="opts.jobTag.pm"></option><option value="regulated" data-i18n="opts.jobTag.regulated"></option></select></label>
        <p id="desiredStatus" class="legend" role="status"></p>
        <div class="mail-actions"><button type="button" id="desiredDelete" data-i18n="opts.desiredDelete"></button></div>
      </fieldset>
      <div id="debriefOpts" class="opt-group" hidden>
        <p id="debriefStatus" class="legend" role="status"></p>
        <div class="mail-actions"><button type="button" id="debriefDelete" data-i18n="debrief.deleteAll"></button></div>
      </div>
      <div class="mail-actions"><button value="close" data-i18n="opts.close"></button></div>
    </form>
  </dialog>
  <dialog id="debrief" class="mail desired" aria-labelledby="debriefTitle">
    <form method="dialog">
      <h2 id="debriefTitle" data-i18n="debrief.title"></h2>
      <p id="debriefCompany" class="mail-body"></p>
      <p class="legend" data-i18n="debrief.hint"></p>
      <label><span data-i18n="debrief.asked"></span><textarea data-debrief="asked" rows="4" maxlength="2000"></textarea></label>
      <label><span data-i18n="debrief.difficult"></span><textarea data-debrief="difficult" rows="2" maxlength="1000"></textarea></label>
      <label><span data-i18n="debrief.outcome"></span><textarea data-debrief="outcome" rows="2" maxlength="500"></textarea></label>
      <p id="debriefOverlap" class="legend" role="status"></p>
      <div class="mail-actions"><button value="close" data-i18n="opts.close"></button></div>
    </form>
  </dialog>
  <dialog id="mail" class="mail">
    <form id="mailForm" method="dialog">
      <h2 data-i18n-mail="title"></h2>
      <p class="mail-body" data-i18n-mail="body"></p>
      <input id="mailEmail" type="email" autocomplete="email" required>
      <label class="consent"><input id="mailConsent" type="checkbox"> <span data-i18n-mail="consent"></span> <a href="/privacy.html" target="_blank" data-i18n="privacy"></a></label>
      <p id="mailMsg" class="mail-msg" role="status"></p>
      <div class="mail-actions">
        <button type="button" id="mailLater" data-i18n-mail="later"></button>
        <button type="submit" id="mailSubmit" class="primary" data-i18n-mail="submit"></button>
      </div>
    </form>
  </dialog>
  <div id="tourDim" class="tour-dim" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
