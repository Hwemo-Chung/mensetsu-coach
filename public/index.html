<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面接コーチ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="bar">面接コーチ <span class="sub" data-i18n="title"></span>
      <select id="lang" class="lang" data-i18n-label="language"></select>
    </header>
    <main id="log" class="log" aria-live="polite"></main>
    <form id="composer" class="composer">
      <div id="chip" class="chip" hidden><span id="chipName"></span><button type="button" id="chipX" data-i18n-label="removeFile">×</button></div>
      <div class="row">
        <label class="attach" data-i18n-label="attach">📎<input id="file" type="file" accept=".pdf,.docx,.txt,.md,image/png,image/jpeg,image/webp,image/gif" hidden></label>
        <textarea id="input" rows="2" required></textarea>
        <button id="send" type="submit" data-i18n="send"></button>
      </div>
      <p class="note" data-i18n="note"></p>
    </form>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
