<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>面接コーチ ノードビューア</title>
<style>
:root{--bg:#08080f;--band:#0c0b16;--card:#12121c;--pill:#181826;--wire:#2f3146;--line:#23243a;--t1:#f4f3fa;--t2:#c9c7d6;--t3:#9a98aa;--sel:#8e76f1;--run:#5a3ce6;--pass:#6fe27f;--fail:#f2566f;--fix:#aea4f6;--live:#f5577f;--chip:#d4d0de;--chipt:#1b1a24;--ts:1}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--t1);font:11px/1.5 Pretendard,"Pretendard JP","Apple SD Gothic Neo","Hiragino Sans","Malgun Gothic","Yu Gothic",sans-serif}
body{display:grid;grid-template-rows:auto 1fr 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pill);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer}
button:hover{border-color:var(--sel)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
/* top band */
#top{background:var(--band);border-bottom:1px solid var(--line);padding:8px 16px;min-height:80px;display:flex;flex-direction:column;gap:4px;min-width:0}
.r1,.r2{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);white-space:nowrap}
.logo i{width:10px;height:10px;border:2px solid var(--sel);border-radius:2px;transform:rotate(45deg)}
#tabs{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
#tabs button{background:none;border-color:transparent;color:var(--t3);white-space:nowrap}
#tabs button.on{color:var(--t1);border-color:var(--line);background:var(--pill)}
.ctl{margin-left:auto;display:flex;gap:4px;align-items:center;flex-shrink:0}
.live{display:flex;align-items:center;gap:6px;color:var(--t3)}
.live i{width:8px;height:8px;border-radius:50%;background:#3a3a4e}
.live.on{color:var(--t1)}
.live.on i{background:var(--live);box-shadow:0 0 12px var(--live);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#bRun{border-color:#3b2ea0;background:#1b1640}
h1{font-size:18px;font-weight:600;white-space:nowrap}
.ver{background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:10px;color:var(--t2)}
.memo{color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#stats{margin-left:auto;display:flex;gap:20px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat small{font-size:10px;color:var(--t3)}
.stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:10px;color:var(--t3)}
.s-pass b{color:var(--pass)}.s-fail b{color:var(--fail)}.s-fix b{color:var(--fix)}
/* stage */
#stage{position:relative;overflow:hidden;touch-action:none;cursor:default;background:radial-gradient(circle at 1px 1px,#16162a 1px,transparent 1.2px) 0 0/24px 24px,var(--bg);min-width:0}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:0;height:0}
#wires,#glow,#boxes{position:absolute;left:0;top:0}
#wires{overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.4}
#wires path.cyc{stroke:var(--fail);stroke-dasharray:6 5}
#glow{pointer-events:none}
.gbox{position:absolute;border:1px solid var(--gc35);background:var(--gc04);border-radius:10px}
.gbox .gl{position:absolute;left:12px;top:8px;font-size:11px;color:var(--t2);white-space:nowrap;font-size:calc(11px*var(--ts))}
.gbox .gl b{color:var(--gc);font-weight:600}
.card{position:absolute;width:248px;background:var(--card);border:1px solid var(--gc45);border-radius:8px;user-select:none}
.card.sel{border-color:var(--sel);box-shadow:0 0 24px rgba(142,118,241,.3)}
.card.run{border-color:var(--run);animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{box-shadow:0 0 0 rgba(90,60,230,0)}50%{box-shadow:0 0 24px rgba(90,60,230,.6)}}
.card.block{opacity:.45}
.card.fail{border-color:rgba(242,86,111,.7)}
.fx{position:absolute;inset:-1px;border-radius:8px;pointer-events:none}
.fl{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 24px 6px var(--fc,rgba(244,243,250,.5))}100%{box-shadow:0 0 0 0 transparent}}
.hd{display:flex;align-items:center;gap:8px;padding:8px 12px 2px;cursor:grab;height:30px}
.hd:active{cursor:grabbing}
.sq{width:8px;height:8px;border-radius:2px;background:var(--gc);flex-shrink:0}
.nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{margin-left:auto;font-size:10px;color:var(--t2);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex-shrink:0}
.r2c{display:flex;align-items:center;gap:8px;padding:2px 12px;height:22px}
.model{background:var(--pill);border-radius:999px;padding:0 8px;font-size:10px;color:var(--t2);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{margin-left:auto;font-size:10px;padding:0 6px;border-radius:3px;color:var(--t3);white-space:nowrap}
.b-run{background:var(--run);color:#fff}.c-pass{color:var(--pass)}.b-fail{background:var(--fail);color:#fff}.c-fix{color:var(--fix)}
.role{padding:0 12px;height:24px;line-height:24px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.role .bad{color:var(--fail);overflow:hidden;text-overflow:ellipsis}
.role span{overflow:hidden;text-overflow:ellipsis}
.fixb{padding:0 6px;height:18px;font-size:10px;border-color:var(--fail);flex-shrink:0}
.ports{display:flex;justify-content:space-between;padding:4px 0 8px;border-top:1px solid var(--line);margin-top:2px}
.ports>div{display:flex;flex-direction:column;min-width:0}
.outs{align-items:flex-end}
.pt{position:relative;height:16px;line-height:16px;font-size:10px;color:var(--t3);padding:0 12px;white-space:nowrap}
.pt i{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gc)}
.ins .pt i{left:-5px}.outs .pt i{right:-5px}
.pt i.fl{animation:pflash 1.1s ease-out}
@keyframes pflash{0%{background:var(--gc);box-shadow:0 0 12px 3px var(--gc)}100%{box-shadow:none}}
.big{display:none;position:absolute;inset:0;border-radius:8px;background:var(--card);flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px;pointer-events:none;overflow:hidden}
.bn{font-size:calc(13px*var(--ts));font-weight:600;line-height:1.15;color:var(--t1);word-break:break-all}
.bk{font-size:calc(10px*var(--ts));color:var(--t2);white-space:nowrap}
.bs.c-pass,.bs.c-fix{font-weight:600}.bs.b-run{color:#b3a4ff;background:none}.bs.b-fail{color:var(--fail);background:none;font-weight:600}
#world.lod .big{display:flex}
.inp{position:absolute;width:120px;height:28px;border-radius:999px;background:var(--pill);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t2)}
.inp i{position:absolute;right:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--chip)}
.hub{position:absolute;width:100px;height:100px;border-radius:50%;background:var(--t1);box-shadow:0 0 24px rgba(244,243,250,.3);display:flex;align-items:center;justify-content:center;color:var(--chipt);font-size:10px}
.chip{position:absolute;width:64px;height:22px;border-radius:3px;background:var(--chip);color:var(--chipt);font-size:10px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.chip.fl{--fc:rgba(111,226,127,.7)}
.ring{position:absolute;width:140px;height:140px;border-radius:50%;border:6px solid rgba(111,226,127,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2)}
.ring b{font-size:22px;color:var(--pass);font-variant-numeric:tabular-nums}
.ring.fl{animation:rflash 1.1s ease-out}
@keyframes rflash{0%{box-shadow:0 0 48px 12px rgba(111,226,127,.7),inset 0 0 24px rgba(111,226,127,.6);border-color:var(--pass)}100%{box-shadow:none}}
.res{position:absolute;width:200px;text-align:center;color:var(--t3);font-size:10px}
#warn{position:absolute;left:0;right:0;top:0;background:rgba(242,86,111,.14);border-bottom:1px solid var(--fail);color:#ffd5dc;padding:4px 16px;z-index:5}
#mini{position:absolute;left:12px;top:12px;z-index:4;background:var(--band);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px}
#warn:not([hidden])~#mini{top:40px}
#mm{display:block;width:140px;height:70px;cursor:crosshair;border-radius:4px;background:var(--bg)}
.zb{display:flex;gap:4px}.zb button{flex:1;padding:2px 4px;font-size:10px;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--pill);border:1px solid var(--live);border-radius:8px;padding:8px 12px;z-index:6;color:var(--t1)}
#simple{position:absolute;inset:0;background:var(--bg);z-index:3;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:24px;overflow:auto}
.sp{border:1px solid var(--gc,var(--line));border-radius:999px;padding:6px 12px;background:var(--pill);white-space:nowrap}
.sp small{color:var(--t3);margin-left:6px}
.arw{color:var(--t3)}
/* panes */
#pane{position:absolute;inset:0;background:var(--bg);z-index:7;overflow:auto;padding:16px}
#pane h2{font-size:13px;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--t3);font-weight:400;font-size:10px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--pill)}
.tw{overflow-x:auto}
textarea{width:100%;min-height:360px;height:calc(100% - 120px);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;font:11px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.err{color:var(--fail);margin:8px 0;white-space:pre-wrap}
.ok{color:var(--pass);margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.muted{color:var(--t3)}
/* drawer */
#drawer{position:absolute;right:0;top:0;bottom:0;width:380px;max-width:100%;background:var(--band);border-left:1px solid var(--line);z-index:8;display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line)}
.dt button.on{border-color:var(--sel)}
.db{padding:12px 16px;overflow:auto;flex:1}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{color:var(--t3);font-size:10px}
.f input,.f select{background:var(--pill);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
.f.row{flex-direction:row;align-items:center;gap:8px}.f.row input{width:auto}
.lk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.lk a{color:var(--t1);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);flex:1}
.lg{padding:4px 0;border-bottom:1px solid var(--line);color:var(--t2)}
/* bottom */
#bottom{background:var(--band);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:4px 16px;min-width:0}
#logs{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#logs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2);font-size:10px;line-height:17px}
#logs .t{color:var(--t3)}
.L-run{color:#9d8cf5}.L-pass{color:var(--pass)}.L-fail{color:var(--fail)}.L-fix{color:var(--fix)}.L-block{color:var(--t3)}
#cmd{width:300px;background:var(--pill);border:1px solid var(--line);border-radius:4px;padding:8px 12px;flex-shrink:0}
@media (max-width:767px){
 #top{padding:6px 12px;min-height:0}
 .logo,.memo,.ctl .tx{display:none}
 .r1{gap:8px}.ctl button{padding:4px 6px}
 #stats{gap:12px}
 .stat.s-job,.stat.s-fix{display:none}
 .stat b{font-size:18px}
 h1{font-size:15px}
 #drawer{top:auto;width:100%;height:70vh;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0}
 #bottom{gap:8px;padding:4px 12px}
 #logs div:nth-child(n+2){display:none}
 #cmd{width:46%}
 #mini{transform:scale(.85);transform-origin:0 0}
}
@media (prefers-reduced-motion:reduce){.fl,.pt i.fl,.ring.fl,.card.run,.live.on i{animation:none!important}}
</style>

"use strict";
// ---- reference geometry ----
const bez=(a,c1,c2,b,t)=>{const u=1-t;return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}};
function wire(p0,p3){const d=Math.max(40,Math.abs(p3.x-p0.x)*.5),c1={x:p0.x+d,y:p0.y},c2={x:p3.x-d,y:p3.y},pts=[],cum=[];let len=0;
for(let i=0;i<=48;i++){const p=bez(p0,c1,c2,p3,i/48);if(i)len+=Math.hypot(p.x-pts.at(-2),p.y-pts.at(-1));pts.push(p.x,p.y);cum.push(len)}return{p0,c1,c2,p3,pts,cum,len}}
function pointAt(g,s){if(s<=0)return{x:g.pts[0],y:g.pts[1]};if(s>=g.len)return{x:g.pts.at(-2),y:g.pts.at(-1)};let lo=0,hi=g.cum.length-1;
while(hi-lo>1){const m=(lo+hi)>>1;if(g.cum[m]<s)lo=m;else hi=m}const f=(s-g.cum[lo])/(g.cum[hi]-g.cum[lo]||1);

function tracePart(ctx,g,s0,s1){const a=pointAt(g,s0);ctx.beginPath();ctx.moveTo(a.x,a.y);
for(let i=0;i<g.cum.length;i++)if(g.cum[i]>s0&&g.cum[i]<s1)ctx.lineTo(g.pts[i*2],g.pts[i*2+1]);const b=pointAt(g,s1);ctx.lineTo(b.x,b.y)}

function lineOfRe(text,re){if(!text)return null;const m=re.exec(text);return m?text.slice(0,m.index).split("\n").length:null}

 for(const k of ["groups","nodes","edges"])if(!Array.isArray(o[k]))return bad(L(new RegExp(`"${k}"`)),`"${k}" は配列にしてください`);
 if(o.items!=null&&!Array.isArray(o.items))return bad(L(/"items"/),`"items" は配列にしてください`);
 const gids=new Set();for(const g of o.groups){if(!g||typeof g.id!=="string"||!g.id)return bad(L(/"groups"/),"groups の各要素に文字列の id が必要です");gids.add(g.id)}

for(const[k,n]of o.nodes.entries()){
  if(!n||typeof n.id!=="string"||!n.id)return bad(L(/"nodes"/),"nodes に id のないノードがあります");
  const ln=nthLine(text,"nodes","id",k);
  if(ids.has(n.id))return bad(ln,`ノード id "${n.id}" が重複しています`);
  if(!gids.has(n.group))return bad(ln,`ノード "${n.id}" の group "${n.group}" が groups にありません`);
  for(const k of ["inputs","outputs"])if(!Array.isArray(n[k])||n[k].some(p=>typeof p!=="string"))return bad(ln,`ノード "${n.id}" の ${k} は文字列の配列にしてください`);
  if(n.duration!=null&&!(typeof n.duration==="number"&&n.duration>=0))return bad(ln,`ノード "${n.id}" の duration は0以上の数にしてください`);
  if(n.pos!=null&&!(typeof n.pos.x==="number"&&typeof n.pos.y==="number"))return bad(ln,`ノード "${n.id}" の pos は {x, y} の数にしてください`);
  ids.set(n.id,n)}
 for(const[k,e]of o.edges.entries()){
  const ln=nthLine(text,"edges","from",k);
  if(!e||typeof e.from!=="string"||typeof e.to!=="string")return bad(ln,"edges の各要素に from と to の文字列が必要です");
  const f=ref(e.from),t=ref(e.to);
  if(!ids.has(f.id))return bad(ln,`接続元のノード "${f.id}" がありません`);
  if(!ids.has(t.id))return bad(ln,`接続先のノード "${t.id}" がありません`);
  if(f.port!=null&&!ids.get(f.id).outputs.includes(f.port))return bad(ln,`ノード "${f.id}" に出力ポート "${f.port}" がありません`);
  if(t.port!=null&&!ids.get(t.id).inputs.includes(t.port))return bad(ln,`ノード "${t.id}" に入力ポート "${t.port}" がありません`)}
 return null}

function arrive(e,j){const w=W[j],s=e.ws[j];
 if(w.k==="in"){flash($("#hub"));if(!e.hub&&inWires.every(k=>e.ws[k].done)){e.hub=true;const m=Math.max(...inWires.map(k=>e.ws[k].arr));hubOut.forEach(k=>launch(e,k,m+.06))}return}
 const t=w.to;
 if(t.t==="node"){const c=cardEl(t.id);if(c){c.querySelector(".fx").style.setProperty("--fc",rgba(gcol(byId[t.id].group),.55));flash(c.querySelector(".fx"));const pi=byId[t.id].inputs.indexOf(t.port);flash(c.querySelectorAll(".ins .pt i")[pi<0?0:pi])}tryFire(e,t.id)}

function tryFire(e,id){if(e.kind==="live"||e.fired.has(id))return;if(e.kind==="run"&&ST[id].st!=="wait")return;

 if(e.kind==="demo")return fireOut(e,id,ready+.06);

 else{setSt(id,"pass");log("pass",id,"通過しました");fireOut(e,id,end+.06)}}
function downstream(ids){const seen=new Set(),st=[...ids];while(st.length){const u=st.pop();for(const e of E2)if(e.from===u&&!CYC.has(E2.indexOf(e))&&!seen.has(e.to)){seen.add(e.to);st.push(e.to)}}return seen}
function blockDown(){const fails=D.nodes.filter(n=>ST[n.id].st==="fail").map(n=>n.id);const ds=downstream(fails);
 D.nodes.forEach(n=>{const s=ST[n.id];if(ds.has(n.id)&&s.st==="wait"){setSt(n.id,"block");log("block",n.id,"上流の失敗で止まりました")}
  else if(!ds.has(n.id)&&s.st==="block")setSt(n.id,"wait")})}
function tick(e,t){
 e.ws.forEach((s,j)=>{if(s.dep!=null&&!s.done&&s.arr<=t){s.done=true;arrive(e,j)}});
 if(e.kind==="run")for(const[id,end]of[...e.running])if(end<=t)complete(e,id,end);
 if(e.end){if(e.kind==="demo"&&t>e.last+2.4)E=mkEngine("demo");return}
 const flying=e.ws.some(s=>s.dep!=null&&!s.done),busy=flying||e.running.size;
 if(!busy&&e.kind!=="live"){e.end=true;e.last=Math.max(0,...e.ws.filter(s=>s.done).map(s=>s.arr));if(e.kind==="run")finishRun()}}
function finishRun(){D.nodes.forEach(n=>{if(["wait","run"].includes(ST[n.id].st))setSt(n.id,"block")});const c=counts(),r=RUNS.at(-1);if(r){Object.assign(r,c,{fix:FIX,state:"完了"})}
 log("info",null,`実行が終わりました: 通過 ${c.pass} · 失敗 ${c.fail} · 停止 ${c.block}（計 ${c.pass+c.fail+c.block}/${D.nodes.length}）`);renderTop();if(curTab==="runs")renderPane()}
function draw(e,t){ctx.setTransform(K,0,0,K,-BB.x*K,-BB.y*K);ctx.clearRect(BB.x,BB.y,BB.w,BB.h);if(!e)return;

 W.forEach((w,j)=>{if(w.cyc)return;const s=e.ws[j],g=w.g,c=w.col;
  if(e.kind==="demo"&&RM){full(w,.35);return}
  if(s.dep==null||t<s.dep)return;

  if(t<s.arr){const L=ease((t-s.dep)/(s.arr-s.dep))*g.len;
   part(g,0,L,6,rgba(c,.22));part(g,0,L,1.6,rgba(c,.9));
   const a=Math.max(0,L-120),pa=pointAt(g,a),pb=pointAt(g,L);
   if(L-a>1){const gr=ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);gr.addColorStop(0,rgba(c,0));gr.addColorStop(1,rgba(c,.95));part(g,a,L,3.4,gr)}
   const rg=ctx.createRadialGradient(pb.x,pb.y,0,pb.x,pb.y,10);rg.addColorStop(0,"rgba(255,255,255,.95)");rg.addColorStop(.35,rgba(c,.85));rg.addColorStop(1,rgba(c,0));

 arr.forEach(x=>{if(!x||typeof x!=="object")return;const id=byId[x.node]?x.node:D.nodes.find(n=>n.name===x.node)?.id;if(id)last[id]=x});

  const st={running:"run",pass:"pass",fail:"fail",fixed:"fixed"}[x.status];if(!st)continue;

  $("#jImport").onclick=()=>$("#jFile").click();
  $("#jFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();$("#jText").value=t;applyJson(t)};
  $("#jReset").onclick=()=>{D=structuredClone(DEF);save();ST={};RUNS=[];FIX=0;layout(true);renderPane();jmsg("ok","初期データに戻しました")}}}
function jmsg(k,m){const el=$("#jMsg");if(el)el.innerHTML=m?`<div class="${k}">${esc(m)}</div>`:""}
function applyJson(txt){let o;try{o=JSON.parse(txt)}catch(err){const m=String(err.message);let line=null,x;
  if((x=m.match(/line (\d+)/)))line=+x[1];else if((x=m.match(/position (\d+)/)))line=txt.slice(0,+x[1]).split("\n").length;
  return jmsg("err",`${line?line+" 行目: ":""}JSON の書式が正しくありません — ${m}`)}
 const v=validate(o,txt);if(v)return jmsg("err",`${v.line} 行目: ${v.msg}`);
 D=o;save();ST={};layout(true);jmsg("ok",`適用しました（ノード ${D.nodes.length} · 接続 ${D.edges.length}）。グラフを再配置しました。`)}

// ---- drawer ----
function openDrawer(id,tab){drawerId=id;if(tab)drawerTab=tab;$("#drawer").hidden=false;selCard(id);renderDrawer()}
function closeDrawer(){drawerId=null;$("#drawer").hidden=true;selCard(null)}
function renderDrawer(){const n=byId[drawerId];if(!n)return closeDrawer();const d=$("#drawer");
 let body="";
 if(drawerTab==="info"){body=`
<div class="f"><label>名前</label><input data-k="name" value="${esc(n.name)}"></div>
<div class="f"><label>区間</label><select data-k="group">${D.groups.map(g=>`<option value="${esc(g.id)}"${g.id===n.group?" selected":""}>${esc(g.name)}</option>`).join("")}</select></div>
<div class="f"><label>種類</label><select data-k="kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}"${k===n.kind?" selected":""}>${v}</option>`).join("")}</select></div>
<div class="f"><label>モデル</label><input data-k="model" value="${esc(n.model)}"></div>
<div class="f"><label>役割</label><input data-k="role" value="${esc(n.role)}"></div>
<div class="f"><label>入力ポート（読点 、 か , で区切る）</label><input data-k="inputs" value="${esc(n.inputs.join("、"))}"></div>
<div class="f"><label>出力ポート</label><input data-k="outputs" value="${esc(n.outputs.join("、"))}"></div>
<div class="f"><label>所要時間（秒・再生用）</label><input data-k="duration" type="number" min="0" step="0.1" value="${esc(n.duration)}"></div>
<div class="f row"><input data-k="fail" type="checkbox" id="fFail"${n.fail?" checked":""}><label for="fFail" style="font-size:11px;color:var(--t2)">▶ 実行で失敗させる</label></div>
<div class="f"><label>失敗の理由</label><input data-k="failReason" value="${esc(n.failReason)}"></div>
<div class="bar">${ST[n.id].st==="fail"?`<button data-fix="${esc(n.id)}">修正する</button>`:""}${n.pos?`<button id="dAuto">自動配置に戻す</button>`:""}<button id="dDel" style="border-color:var(--fail)">ノードを削除</button></div>`}
 else if(drawerTab==="log"){const ls=LOGS.filter(l=>l.id===n.id).reverse();body=ls.length?ls.map(l=>`<div class="lg">${logLine(l)}</div>`).join(""):`<p class="muted">このノードの記録はまだありません。</p>`}
 else{const ins=E2.filter(e=>e.to===n.id),outs=E2.filter(e=>e.from===n.id),lk=(e,other,dir)=>`<div class="lk"><a data-go="${esc(other)}">${dir==="in"?`${esc(byId[other].name)}:${esc(e.fp)} → ${esc(e.tp)}`:`${esc(e.fp)} → ${esc(byId[other].name)}:${esc(e.tp)}`}</a>${CYC.has(E2.indexOf(e))?'<span style="color:var(--fail)">循環</span>':""}<button data-del="${e.i}" aria-label="接続を削除">×</button></div>`;
  const targets=D.nodes.filter(x=>x.id!==n.id).flatMap(x=>x.inputs.map(p=>`<option value="${esc(x.id+":"+p)}">${esc(x.name)} : ${esc(p)}</option>`)).join("");
  body=`<p class="muted">入力（${ins.length}）</p>${ins.map(e=>lk(e,e.from,"in")).join("")||'<p class="muted">ハブから自動で接続されます</p>'}
<p class="muted" style="margin-top:12px">出力（${outs.length}）</p>${outs.map(e=>lk(e,e.to,"out")).join("")||'<p class="muted">最後のノードは作業・完了へ自動で接続されます</p>'}
<p class="muted" style="margin-top:16px">接続を追加</p><div class="f"><select id="cFrom">${n.outputs.map(p=>`<option>${esc(p)}</option>`).join("")}</select></div><div class="f"><select id="cTo">${targets}</select></div><button id="cAdd"${n.outputs.length&&targets?"":" disabled"}>追加</button>`}
 const tb=[["info","情報"],["log","記録"],["link","接続"]].map(([k,v])=>`<button data-dt="${k}" class="${drawerTab===k?"on":""}">${v}</button>`).join("");
 const st=ST[n.id].st;
 d.innerHTML=`<div class="dh"><i class="sq" style="background:${gcol(n.group)}"></i><b>${esc(n.name)}</b><span class="muted">${{idle:"待機",wait:"待機",run:"実行中",pass:"通過",fixed:"修正",fail:"失敗",block:"停止"}[st]}</span><button id="dClose" aria-label="閉じる">×</button></div><div class="dt">${tb}</div><div class="db">${body}</div>`;
 $("#dClose").onclick=closeDrawer;d.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{drawerTab=b.dataset.dt;renderDrawer()});
 d.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener(inp.type==="checkbox"||inp.tagName==="SELECT"?"change":"input",()=>editField(n.id,inp.dataset.k,inp.type==="checkbox"?inp.checked:inp.value)));
 $("#dDel")&&($("#dDel").onclick=()=>delNode(n.id));$("#dAuto")&&($("#dAuto").onclick=()=>{n.pos=null;save();layout(false);renderDrawer()});
 d.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{fixNode(b.dataset.fix);renderDrawer()});
 d.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{const id=a.dataset.go;openDrawer(id);focusNode(id)});
 d.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{D.edges.splice(+b.dataset.del,1);save();layout(false);log("info",n.id,"接続を削除しました")});
 $("#cAdd")&&($("#cAdd").onclick=()=>{D.edges.push({from:`${n.id}:${$("#cFrom").value}`,to:$("#cTo").value});save();layout(false);log("info",n.id,"接続を追加しました")})}
let editT=0;
function editField(id,k,v){const n=byId[id];
 if(k==="inputs"||k==="outputs"){const old=n[k],nw=String(v).split(/[、,]/).map(s=>s.trim()).filter(Boolean),side=k==="inputs"?"to":"from";
  D.edges=D.edges.filter(e=>{const r=ref(e[side]);if(r.id!==id||r.port==null)return true;const i=old.indexOf(r.port);if(i<0||i>=nw.length)return false;e[side]=`${id}:${nw[i]}`;return true});n[k]=nw}
 else if(k==="duration")n[k]=Math.max(0,+v||0);else n[k]=v;
 save();clearTimeout(editT);
 if(["name","model","role","failReason","duration","fail"].includes(k)){const el=cardEl(id);if(k==="name"){el.querySelector(".nm").textContent=v;el.querySelector(".bn").textContent=v;$("#drawer .dh b").textContent=v;if(simpleOn)renderSimple()}
  if(k==="model"){const m=el.querySelector(".model");m.textContent=v;m.title=v}updCard(id);if(curTab!=="graph")renderPane();return}
 editT=setTimeout(()=>{const keep=document.activeElement?.dataset?.k;layout(false);if(keep){const f=$(`#drawer [data-k="${keep}"]`);if(f){f.focus();if(f.setSelectionRange&&f.type==="text")f.setSelectionRange(f.value.length,f.value.length)}}},250)}

// ---- command box ----
$("#cmd").addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const s=e.target.value.trim();if(!s)return;e.target.value="";command(s)});
function findNode(s){s=s.trim().replace(/^「|」$/g,"");return D.nodes.find(n=>n.id===s)||D.nodes.find(n=>n.name===s)||D.nodes.find(n=>n.name.includes(s))}
function command(s){let m;
 if((m=s.match(/^(.+?)\s*を追加(?:する|して)?$/)||s.match(/^追加\s+(.+)$/))){addNode(m[1].trim());return}
 if((m=s.match(/^(.+?)\s*を削除(?:する|して)?$/))){const n=findNode(m[1]);return n?delNode(n.id):log("info",null,`「${m[1]}」というノードが見つかりません`)}
 if((m=s.match(/^(.+?)\s*を\s*(失敗|通過)(?:に|と)?(?:する|して)?$/))){const n=findNode(m[1]);if(!n)return log("info",null,`「${m[1]}」というノードが見つかりません`);n.fail=m[2]==="失敗";save();updCard(n.id);if(drawerId===n.id)renderDrawer();return log("info",n.id,`▶ 実行で${m[2]}させる設定にしました`)}
 if((m=s.match(/^(.+?)\s*(?:→|->|⇒|から)\s*(.+?)\s*(?:へ|に)?\s*(?:接続(?:する|して)?|つなぐ)?$/))){const a=findNode(m[1]),b=findNode(m[2]);
  if(!a||!b)return log("info",null,`ノードが見つかりません: ${!a?m[1]:m[2]}`);if(!a.outputs.length||!b.inputs.length)return log("info",null,"ポートのないノードは接続できません");
  D.edges.push({from:`${a.id}:${a.outputs[0]}`,to:`${b.id}:${b.inputs[0]}`});save();layout(false);return log("info",a.id,`${a.name} → ${b.name} を接続しました`)}
 log("info",null,`解釈できませんでした: 「${s}」（例: 「A→B」「Xを追加」「Xを削除」「Xを失敗にする」）`)}

// ---- boot ----
D=load();renderLogs();layout(true);requestAnimationFrame(frame);
let rzT=0;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{drawMini()},100)});
</script>
</body>
</html>
